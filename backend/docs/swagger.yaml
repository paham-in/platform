basePath: /
definitions:
  subject.ErrorResponse:
    properties:
      error:
        example: error message
        type: string
    type: object
  subject.MessageResponse:
    properties:
      message:
        example: berhasil
        type: string
    type: object
  subject.SubjectResponse:
    properties:
      description:
        type: string
      id:
        type: integer
      material_count:
        type: integer
      name:
        type: string
      slug:
        type: string
    type: object
  user.AdminUserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      role:
        type: string
    type: object
  user.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/user.UserResponse'
    type: object
  user.ErrorResponse:
    properties:
      error:
        example: error message
        type: string
    type: object
  user.LoginInput:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  user.MessageResponse:
    properties:
      message:
        example: berhasil
        type: string
    type: object
  user.RegisterInput:
    properties:
      confirm_password:
        type: string
      email:
        type: string
      name:
        minLength: 3
        type: string
      password:
        minLength: 6
        type: string
      role:
        enum:
        - student
        - teacher
        type: string
    required:
    - confirm_password
    - email
    - name
    - password
    - role
    type: object
  user.UserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      role:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Platform bimbingan belajar online
  title: Bimbel API
  version: "1.0"
paths:
  /admin/subjects:
    post:
      consumes:
      - application/json
      description: Menambah mata pelajaran baru (admin only)
      parameters:
      - description: Data subject
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/subject.SubjectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/subject.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create subject
      tags:
      - Admin
  /admin/subjects/{id}:
    delete:
      consumes:
      - application/json
      description: Menghapus mata pelajaran (admin only)
      parameters:
      - description: Subject ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/subject.MessageResponse'
      security:
      - BearerAuth: []
      summary: Delete subject
      tags:
      - Admin
    patch:
      consumes:
      - application/json
      description: Mengubah mata pelajaran (admin only)
      parameters:
      - description: Subject ID
        in: path
        name: id
        required: true
        type: integer
      - description: Data update
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/subject.SubjectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/subject.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update subject
      tags:
      - Admin
  /admin/users:
    get:
      consumes:
      - application/json
      description: Mengembalikan daftar semua user (admin only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/user.AdminUserResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all users
      tags:
      - Admin
  /admin/users/{id}:
    delete:
      consumes:
      - application/json
      description: Menghapus user berdasarkan ID (admin only)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - Admin
  /admin/users/{id}/role:
    patch:
      consumes:
      - application/json
      description: Mengubah role user (admin only)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Role baru
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user role
      tags:
      - Admin
  /login:
    post:
      consumes:
      - application/json
      description: Login dengan email dan password, mengembalikan token session
      parameters:
      - description: Data login
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.ErrorResponse'
      summary: Login user
      tags:
      - Auth
  /logout:
    post:
      consumes:
      - application/json
      description: Menghapus session token dari database
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - Auth
  /me:
    get:
      consumes:
      - application/json
      description: Mengembalikan data user berdasarkan token session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - Auth
  /register:
    post:
      consumes:
      - application/json
      description: Mendaftarkan akun baru sebagai murid atau guru
      parameters:
      - description: Data registrasi
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.RegisterInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/user.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ErrorResponse'
      summary: Register user
      tags:
      - Auth
  /subjects:
    get:
      consumes:
      - application/json
      description: Mengembalikan daftar semua mata pelajaran
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/subject.SubjectResponse'
            type: array
      summary: List subjects
      tags:
      - Subjects
schemes:
- http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
