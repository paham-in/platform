      security:
      - BearerAuth: []
      summary: Create class
      tags:
      - Admin
  /admin/classes/{id}:
    delete:
      consumes:
      - application/json
      description: Menghapus kelas
      parameters:
      - description: Class ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/class.MessageResponse'
      security:
      - BearerAuth: []
      summary: Delete class
      tags:
      - Admin
    patch:
      consumes:
      - application/json
      description: Mengubah kelas
      parameters:
      - description: Class ID
        in: path
        name: id
        required: true
        type: integer
      - description: Data update
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
