host: localhost:8080
info:
  contact: {}
  description: Platform bimbingan belajar online
  title: Bimbel API
  version: "1.0"
paths:
  /admin/chapters:
    get:
      consumes:
      - application/json
      description: Mengembalikan daftar semua chapter, bisa difilter dengan class_id
        & subject_id
      parameters:
      - description: Filter by class ID
        in: query
        name: class_id
        type: integer
      - description: Filter by subject ID
        in: query
        name: subject_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/chapter.ChapterResponse'
            type: array
      security:
      - BearerAuth: []
      summary: List chapters
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Menambah chapter baru
      parameters:
      - description: Data chapter
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/chapter.CreateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/chapter.ChapterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chapter.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create chapter
      tags:
      - Admin
  /admin/chapters/{id}:
    delete:
      consumes:
      - application/json
      description: Menghapus chapter
      parameters:
      - description: Chapter ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chapter.MessageResponse'
      security:
      - BearerAuth: []
      summary: Delete chapter
      tags:
      - Admin
    patch:
      consumes:
      - application/json
      description: Mengubah chapter
      parameters:
      - description: Chapter ID
        in: path
        name: id
        required: true
        type: integer
      - description: Data update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/chapter.UpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chapter.ChapterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chapter.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update chapter
      tags:
      - Admin
  /admin/classes:
    get:
      consumes:
      - application/json
      description: Mengembalikan daftar semua kelas
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/class.ClassResponse'
            type: array
      security:
      - BearerAuth: []
      summary: List classes
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Menambah kelas baru
      parameters:
      - description: Data kelas
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/class.ClassResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/class.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create class
      tags:
      - Admin
  /admin/classes/{id}:
    delete:
      consumes:
      - application/json
      description: Menghapus kelas
      parameters:
      - description: Class ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/class.MessageResponse'
      security:
      - BearerAuth: []
      summary: Delete class
      tags:
      - Admin
    patch:
      consumes:
      - application/json
      description: Mengubah kelas
      parameters:
      - description: Class ID
        in: path
        name: id
        required: true
        type: integer
      - description: Data update
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/class.ClassResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/class.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update class
      tags:
      - Admin
  /admin/materials:
    get:
      consumes:
      - application/json
      description: Mengembalikan daftar semua materi, bisa difilter dengan chapter_id
      parameters:
      - description: Filter by chapter ID
        in: query
        name: chapter_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/material.MaterialResponse'
            type: array
      security:
      - BearerAuth: []
      summary: List materials
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Menambah materi baru
      parameters:
      - description: Data materi
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/material.CreateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/material.MaterialResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/material.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create material
      tags:
      - Admin
  /admin/materials/{id}:
    delete:
      consumes:
      - application/json
      description: Menghapus materi berdasarkan ID
      parameters:
      - description: Material ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/material.MessageResponse'
      security:
      - BearerAuth: []
      summary: Delete material
      tags:
      - Admin
    get:
      consumes:
      - application/json
      description: Mengambil detail materi berdasarkan ID
      parameters:
      - description: Material ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/material.MaterialResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/material.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get material
      tags:
      - Admin
    patch:
      consumes:
      - application/json
      description: Mengubah materi berdasarkan ID
      parameters:
      - description: Material ID
        in: path
        name: id
        required: true
        type: integer
      - description: Data update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/material.UpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/material.MaterialResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/material.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update material
      tags:
      - Admin
  /admin/subjects:
    post:
      consumes:
      - application/json
      description: Menambah mata pelajaran baru (admin only)
      parameters:
      - description: Data subject
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/subject.CreateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/subject.SubjectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/subject.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create subject
      tags:
      - Admin
  /admin/subjects/{id}:
    delete:
      consumes:
      - application/json
      description: Menghapus mata pelajaran (admin only)
      parameters:
      - description: Subject ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/subject.MessageResponse'
      security:
      - BearerAuth: []
      summary: Delete subject
      tags:
      - Admin
    patch:
      consumes:
      - application/json
      description: Mengubah mata pelajaran (admin only)
      parameters:
      - description: Subject ID
        in: path
        name: id
        required: true
        type: integer
      - description: Data update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/subject.UpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/subject.SubjectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/subject.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update subject
      tags:
      - Admin
  /admin/users:
    get:
      consumes:
      - application/json
      description: Mengembalikan daftar semua user (admin only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/user.AdminUserResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all users
      tags:
      - Admin
  /admin/users/{id}:
    delete:
      consumes:
      - application/json
      description: Menghapus user berdasarkan ID (admin only)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - Admin
  /admin/users/{id}/payment:
    patch:
      consumes:
      - application/json
      description: Mengubah status pembayaran user (pending/paid)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Status
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Toggle payment status
      tags:
      - Admin
  /admin/users/{id}/role:
    patch:
      consumes:
      - application/json
      description: Mengubah role user (admin only)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Role baru
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user role
      tags:
      - Admin
  /auth/google:
    get:
      description: Redirect to Google OAuth consent screen
      responses:
        "302":
          description: Found
      summary: Login with Google
      tags:
      - Auth
  /auth/google/callback:
    get:
      description: Exchange code for token, get user info, create session
      responses:
        "302":
          description: Found
      summary: Google OAuth callback
      tags:
      - Auth
  /logout:
    post:
      consumes:
      - application/json
      description: Menghapus session token dari database
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - Auth
  /me:
    get:
      consumes:
      - application/json
      description: Mengembalikan data user berdasarkan token session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - Auth
  /subjects:
    get:
      consumes:
      - application/json
      description: Mengembalikan daftar semua mata pelajaran
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/subject.SubjectResponse'
            type: array
      summary: List subjects
      tags:
      - Subjects
schemes:
- http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
