host: localhost:8080
info:
  contact: {}
  description: Platform bimbingan belajar online
  title: paham.in API
  version: "1.0"
paths:
  /admin/chapters:
    get:
      consumes:
      - application/json
      description: Mengembalikan daftar semua chapter, bisa difilter dengan class_id
        & subject_id
      parameters:
      - description: Filter by class ID
        in: query
        name: class_id
        type: integer
      - description: Filter by subject ID
        in: query
        name: subject_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/chapter.ChapterResponse'
            type: array
      security:
      - BearerAuth: []
      summary: List chapters
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Menambah chapter baru
      parameters:
      - description: Data chapter
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/chapter.CreateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/chapter.ChapterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chapter.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create chapter
      tags:
      - Admin
  /admin/chapters/{id}:
    delete:
      consumes:
      - application/json
      description: Menghapus chapter
      parameters:
      - description: Chapter ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chapter.MessageResponse'
      security:
      - BearerAuth: []
      summary: Delete chapter
      tags:
      - Admin
    patch:
      consumes:
      - application/json
      description: Mengubah chapter
      parameters:
      - description: Chapter ID
        in: path
        name: id
        required: true
        type: integer
      - description: Data update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/chapter.UpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chapter.ChapterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chapter.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update chapter
      tags:
      - Admin
  /admin/chapters/{id}/cover:
    post:
      consumes:
      - multipart/form-data
      description: Mengunggah gambar cover untuk chapter
      parameters:
      - description: Chapter ID
        in: path
        name: id
        required: true
        type: integer
      - description: File gambar
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/chapter.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/chapter.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload chapter cover
      tags:
      - Chapters
  /admin/classes:
    get:
      consumes:
      - application/json
      description: Mengembalikan daftar semua kelas
      produces:
      - application/json
