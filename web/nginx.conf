server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip untuk aset teks
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # aset statis dengan hash diberi cache lama; index.html tidak di-cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # service worker & workbox jangan pernah di-cache, agar update PWA terdeteksi
    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires -1;
    }
    location ~* ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache";
        expires -1;
    }

    # SPA fallback: semua route client-side dilayani oleh index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
