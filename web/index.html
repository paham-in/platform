<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Pahamin — platform bimbel online: materi terstruktur, forum tanya-jawab, dan les privat." />
    <meta name="theme-color" content="#0c0c09" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pahamin" />
    <script>
      (() => {
        const theme = localStorage.getItem("vite-ui-theme");
        const dark = theme === "dark" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) {
          document.documentElement.classList.add("dark");
        }
        // Theme awal (pre-hydrate) ikut prefer-color-scheme untuk warnai status bar.
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.content = dark ? "#0c0c09" : "#ffffff";
        }
      })();
    </script>
    <script>
      (() => {
        const standalone =
          window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
        if (standalone) {
          document
            .querySelector('meta[name="viewport"]')
            ?.setAttribute(
              "content",
              "width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
            );
        }
      })();
    </script>
    <title>Pahamin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
